<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AniMus</title>

    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    
</head>
<body>
        <!--Header-->
        
          <h1>ANIMUS</h1>
        

        
        <!--Aura 1-->
          <div class="aura aura-dual" class="center">
            <div class="card bg-base-100" >
              <div class="card-body">
                <img width="300" height="300" src="img/Consume - Chase Atlantic.jpg" alt="Consume">
                
              </div>
            </div>
          </div>

        <!--Aura 2-->
         <div class="aura aura-rainbow" class="center">
            <div class="card bg-base-100" >
              <div class="card-body">
                <img width="300" height="300" src="img/Mindgame.jpg" alt="Mindgame">
                
              </div>
            </div>
          </div>

        <!--Aura 3-->
         <div class="aura aura-gold" class="center">
            <div class="card bg-base-100" >
              <div class="card-body">
                <img width="300" height="300" src="img/Skyfall.png" alt="Skyfall">
                
              </div>
            </div>
          </div>

        <!--Table-->
        <table>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Age</th>
          </tr>
          <tr>
            <td>1</td>
            <td>Yagami</td>
            <td>18</td>
          </tr>
          <tr>
            <td>2</td>
            <td>L</td>
            <td>25</td>
          </tr>
          <tr>
            <td>3</td>
            <td>Naomi</td>
            <td>17</td>
          </tr>
        </table>

</body>
</html>
